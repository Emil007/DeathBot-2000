services:
  deathbot:
    image: ghcr.io/emil007/deathbot-2000:latest
    container_name: deathbot-2000
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      TOKEN: "PUT_DISCORD_BOT_TOKEN_HERE"
      PREFIX: "!"
      ADMIN_ID: "PUT_YOUR_DISCORD_USER_ID_HERE"
      # Instant slash-command updates in this server (also registered globally for DMs):
      DISCORD_GUILD_ID: "PUT_DISCORD_SERVER_ID_HERE"
      CHANNEL_DEATHPOOL: "PUT_DEATHPOOL_CHANNEL_ID_HERE"
      # Optional all-deaths channel (never pings). Comment in and set an id to enable:
      # CHANNEL_ALL_DEATHS: "PUT_ALL_DEATHS_CHANNEL_ID_HERE"
      CHANNEL_ALL_DEATHS: ""
      # Optional admin ops channel (wiki/age review + long admin summaries). Empty = DM-first:
      # CHANNEL_ADMIN: "PUT_ADMIN_CHANNEL_ID_HERE"
      CHANNEL_ADMIN: ""
      # Optional: documented only — Discord cannot hide slash cmds by ADMIN_ID alone
      # ADMIN_ROLE_ID: ""
      WIKI_POLLER_MINUTES: "30"
      DAILY_SUMMARY_HOUR: "9"
      DATA_DIR: "/app/data"
      TZ: "Europe/Berlin"
      ALERT_EMOJI: "⚰️"
      ALERT_EMOJI_REPEAT: "3"
      # Days a live wiki-hit must stay on death lists before it is locked (else retract)
      DEATH_CONFIRM_DAYS: "7"
      # Full-year wiki scrape (matching + all-deaths + retract checks). Default 3am.
      NIGHTLY_FULL_SCRAPE_HOUR: "3"
      # Custom phrases: /app/data/custom_phrases.txt
      CUSTOM_PHRASES: "no"
      # CUSTOM_PHRASES: "mix"
      # CUSTOM_PHRASES: "only"
