services:
  deathbot:
    image: ghcr.io/emil007/deathbot-2000:latest
    container_name: deathbot-2000
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      TOKEN: "PUT_DISCORD_BOT_TOKEN_HERE"
      PREFIX: "!"
      ADMIN_ID: "PUT_YOUR_DISCORD_USER_ID_HERE"
      # Instant slash-command updates in this server (also registered globally for DMs):
      DISCORD_GUILD_ID: "PUT_DISCORD_SERVER_ID_HERE"
      # Optional/legacy: CHANNEL_DEATHPOOL is NO LONGER required. The bot finds
      # or creates the deathpool channel automatically at startup, or asks the
      # admin via an interactive channel-setup (buttons + dropdown) when a
      # matching channel already exists. Comment this out to let the setup
      # decide; if set, it is only a hint for the derive-fallback (not a target).
      # CHANNEL_DEATHPOOL: "PUT_DEATHPOOL_CHANNEL_ID_HERE"
      # Optional all-deaths channel (never pings). Comment in and set an id to enable:
      # CHANNEL_ALL_DEATHS: "PUT_ALL_DEATHS_CHANNEL_ID_HERE"
      CHANNEL_ALL_DEATHS: ""
      # Optional admin ops channel (wiki/age review + long admin summaries). Empty = DM-first:
      # CHANNEL_ADMIN: "PUT_ADMIN_CHANNEL_ID_HERE"
      CHANNEL_ADMIN: ""
      # Optional log channel: inputs, changes and errors incl. technical details.
      # NOTE: wiki scan runs are NEVER logged here (owner rule). Empty = disabled:
      # CHANNEL_LOG: "PUT_LOG_CHANNEL_ID_HERE"
      CHANNEL_LOG: ""
      # Optional: documented only — Discord cannot hide slash cmds by ADMIN_ID alone
      # ADMIN_ROLE_ID: ""
      WIKI_POLLER_MINUTES: "30"
      DAILY_SUMMARY_HOUR: "9"
      DATA_DIR: "/app/data"
      # Bot-Zeitzone: Jahreswechsel/Erinnerungen rechnen in dieser Zone.
      # Europe/Vienna (Wien) ist der Code-Default — ändere den Wert hier auf
      # deine lokale Zone (z.B. Europe/Berlin), der Bot folgt config.tz.
      TZ: "Europe/Vienna"
      ALERT_EMOJI: "⚰️"
      ALERT_EMOJI_REPEAT: "3"
      # Days a live wiki-hit must stay on death lists before it is locked (else retract)
      DEATH_CONFIRM_DAYS: "7"
      # Full-year wiki scrape (matching + all-deaths + retract checks). Default 3am.
      NIGHTLY_FULL_SCRAPE_HOUR: "3"
      # Max names/picks per player list (the Tipp-Assistent caps the whole draft at this,
      # across multiple DMs — not just per paste). Default 50.
      MAX_PICKS_PER_PLAYER: "50"
      # User-Agent sent to Wikipedia (skilled scraping / rate-limit friendliness).
      # GitHub repo + contact so Wikimedia ops can reach you if needed:
      USER_AGENT: "DeathBot-2000/1.0 (Discord death-pool bot; +https://github.com/Emil007/DeathBot-2000)"
      # Custom phrases: /app/data/custom_phrases.txt
      CUSTOM_PHRASES: "no"
      # CUSTOM_PHRASES: "mix"
      # CUSTOM_PHRASES: "only"
      # Eingebaute Phrasebank wählen:
      #   new    = src/phrases/builtin-phrases.json      (Standard, die gemeine 241er-Bank)
      #   old    = src/phrases/builtin-phrases_old.json  (die bisherige 542er-Bank)
      #   custom = nur data/custom_phrases.txt (ohne eingebaute Sätze)
      PHRASES_BANK: "new"
